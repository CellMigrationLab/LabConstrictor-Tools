# This repository's GitHub Pages site: only redirects. The documentation is published on the LabConstrictor website, which fetches
# docs/; every address of the old docs site (https://cellmigrationlab.github.io/LabConstrictor-Tools/<PAGE>/) leads to the page's new
# home (scripts/build_redirect_site.py). Built on pull requests that touch it (a docs page without a destination fails the build);
# published from main.
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, scripts/build_redirect_site.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, scripts/build_redirect_site.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the build never pushes; keep the token out of .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the redirect pages (a docs page with no destination fails the build)
        run: python scripts/build_redirect_site.py --out site

      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redirect-site-preview
          path: site/
          retention-days: 14
      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
