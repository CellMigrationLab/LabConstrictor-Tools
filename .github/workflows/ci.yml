# Runs the Python suites on Linux, Windows and macOS. First run still pending: Windows/macOS results are unknown until it does.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Private virtualenv (Linux)
        if: runner.os == 'Linux'
        # the runner's own Python folder and binary are world-writable, which the registry refuses by design: tests need a private interpreter (a copy, not a symlink to the runner one)
        run: python -m venv --copies "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[test]"
      - name: Python suites
        if: ${{ !(runner.os == 'Linux' && matrix.python == '3.12') }}
        working-directory: tests
        run: python -m unittest discover -v -p "test_*.py"
      - name: Python suites under coverage (production code only; the floor is today's level, rounded down)
        if: ${{ runner.os == 'Linux' && matrix.python == '3.12' }}
        working-directory: tests
        env:
          COVERAGE_RCFILE: ../pyproject.toml
        run: |
          pip install coverage vulture
          python -m coverage run -m unittest discover -v -p "test_*.py"
          python -m coverage combine
          python coverage_report.py --fail-under 85
      - name: Windows-specific suite
        if: runner.os == 'Windows'
        run: python tests/windows/test_windows.py
  compat:
    # Tools against its own last tag: the schema each one writes must be readable by the other, and each worker must accept the other's requests (tests/compat_matrix.py). No tag yet: the job says so and passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the tags
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Newest tag
        id: tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then echo "compat: skipped, this repository has no v* tag yet (the first one is created by the maintainer, docs/OPERATIONS.md)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install this checkout and the newest tag side by side
        if: steps.tag.outputs.tag != ''
        run: |
          pip install -e ".[test]"
          git worktree add "$RUNNER_TEMP/old_src" "${{ steps.tag.outputs.tag }}"
          python -m venv --system-site-packages "$RUNNER_TEMP/old_venv"
          "$RUNNER_TEMP/old_venv/bin/pip" install "$RUNNER_TEMP/old_src"
          "$RUNNER_TEMP/old_venv/bin/python" -c "import labconstrictor_tools as t; print('old Tools:', getattr(t, '__version__', 'no __version__ (before 0.2)'), t.__file__)"
      - name: Old and new, both directions
        if: steps.tag.outputs.tag != ''
        run: python tests/compat_matrix.py --old-python "$RUNNER_TEMP/old_venv/bin/python"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install black==26.10.0 ruff==0.16.10 mypy==1.20.2 vulture==2.16   # mypy 1.20.2 was the newest that installed when this job was added
      - run: black --check .
      - run: ruff check .
      - run: mypy labconstrictor_tools
      - run: vulture labconstrictor_tools tests/vulture_whitelist.py --min-confidence 80
