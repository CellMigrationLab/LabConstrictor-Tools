# Runs the Python suites on Linux, Windows and macOS. First run still pending: Windows/macOS results are unknown until it does.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Private virtualenv (Linux)
        if: runner.os == 'Linux'
        # the runner's own Python folder and binary are world-writable, which the registry refuses by design: tests need a private interpreter (a copy, not a symlink to the runner one)
        run: python -m venv --copies "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[test]"
      - name: Python suites
        working-directory: tests
        run: python -m unittest discover -v -p "test_*.py"
      - name: Windows-specific suite
        if: runner.os == 'Windows'
        run: python tests/windows/test_windows.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install black==26.10.0 ruff==0.16.10 && black --check . && ruff check .
