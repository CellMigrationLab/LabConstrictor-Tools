# Runs the Python suites on Linux, Windows and macOS. First run still pending: Windows/macOS results are unknown until it does.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[test]"
      - name: Python suites
        working-directory: tests
        run: python -m unittest discover -v -p "test_*.py"
      - name: Windows-specific suite
        if: runner.os == 'Windows'
        run: python tests/windows/test_windows.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install black ruff && black --check . && ruff check .
