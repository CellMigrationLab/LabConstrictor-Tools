# Stage 2 of the smoke test: build the CellTracksColab installer on each operating system (the release workflow's steps, but
# nothing is released), install it silently as a plain user, and check that the tools bridge is established. The app's sources
# come from the app repository (default branch bridge-test); the check itself is tests/smoke_bridge.py of this repository.
name: smoke-install
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch or tag of CellTracksColab to build"
        required: false
        default: bridge-test
  push:
    branches: [claude/smoke-bridge]

env:
  APP_REF: ${{ inputs.app_ref || 'bridge-test' }}

jobs:
  build:
    name: Build installer (${{ matrix.os_name }})
    # Intel Macs are not supported (llvmlite and PyTorch no longer ship macOS x86_64 wheels): informational only
    continue-on-error: ${{ matrix.os_name == 'macos-intel' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: linux, runner: ubuntu-latest }
          - { os_name: macos-arm64, runner: macos-15 }
          - { os_name: macos-intel, runner: macos-15-intel }
          - { os_name: windows, runner: windows-latest }
    defaults:
      run:
        shell: bash -l {0}
        working-directory: app
    env:
      CONSTRUCTOR_ENV: constructor-env
      OUTPUT_DIR: dist/${{ matrix.os_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CellMigrationLab/CellTracksColab
          ref: ${{ env.APP_REF }}
          path: app
      - uses: actions/setup-python@v4
        with: { python-version: "3.11" }
      - run: pip install -r .tools/requirements.txt
      - name: Sync versioned files
        run: |
          RELEASE_VERSION="$(sed -n 's/^version: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' construct.yaml | head -1)"
          echo "version $RELEASE_VERSION"
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_version.py" .tools/python/bump_version.py python .tools/python/bump_version.py "${RELEASE_VERSION}"
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_constructor.py" .tools/python/bump_constructor.py python .tools/python/bump_constructor.py
          bash .tools/bash/run_with_context.sh "artifacts/log_${{ matrix.os_name }}.log" "bump_Welcome_notebook.py" .tools/python/bump_Welcome_notebook.py python .tools/python/bump_Welcome_notebook.py CellMigrationLab CellTracksColab
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate: true
          miniforge-version: latest
          use-mamba: true
      - name: Create constructor environment
        run: bash .tools/bash/create_constructor_environment.sh
      - name: Build installer with constructor
        run: bash .tools/bash/build_installer_with_constructor.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os_name }}
          path: app/dist/${{ matrix.os_name }}/*
          retention-days: 3
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os_name }}
          path: app/artifacts/
          if-no-files-found: ignore

  install:
    name: Install and check (${{ matrix.os_name }})
    # Intel Macs are not supported (llvmlite and PyTorch no longer ship macOS x86_64 wheels): informational only
    continue-on-error: ${{ matrix.os_name == 'macos-intel' }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os_name: linux, runner: ubuntu-latest }
          - { os_name: macos-arm64, runner: macos-15 }
          - { os_name: macos-intel, runner: macos-15-intel }
          - { os_name: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CellMigrationLab/CellTracksColab
          ref: ${{ env.APP_REF }}
          path: app
          sparse-checkout: lc_tests/fixtures
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ matrix.os_name }}
          path: installer

      - name: Install silently (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ls -la installer
          INSTALLER="$(ls installer/*.sh | head -1)"
          echo "installing $INSTALLER"
          time bash "$INSTALLER" -b -p "$HOME/ctc"
      - name: Install silently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem installer | Format-Table Name, Length
          $exe = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          Write-Host "installing $exe"
          $p = Start-Process -FilePath $exe -ArgumentList '/InstallationType=JustMe','/RegisterPython=0','/S',"/D=$env:USERPROFILE\ctc" -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: The installer's own log
        if: always()
        shell: bash
        run: cat "$HOME/ctc/menuinst_debug.log" || echo "no menuinst_debug.log"
      - name: The hook registered the app
        shell: bash
        run: |
          LOG="$HOME/ctc/menuinst_debug.log"
          ! grep -q "WARNING: tool registration failed" "$LOG" || { echo "FAIL: the hook reported 'tool registration failed'"; exit 1; }
          grep -q "Found celltracks_lc_tools: registering" "$LOG" || { echo "FAIL: 'Found celltracks_lc_tools: registering' is not in menuinst_debug.log"; exit 1; }
          if [ "$RUNNER_OS" != "Windows" ]; then  # only the .sh hook prints this line (the protocol says so)
            grep -q "Tools registered" "$LOG" || { echo "FAIL: 'Tools registered' is not in menuinst_debug.log"; exit 1; }
          fi
          echo "registration lines found"

      - name: Bridge smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$HOME/ctc/bin/python" tests/smoke_bridge.py --app CellTracksColab --tool calculate_metrics --param tracks=app/lc_tests/fixtures/tracks.csv --bad-param tracks=/nonexistent/none.csv
      - name: Bridge smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$HOME/ctc/python.exe" tests/smoke_bridge.py --app CellTracksColab --tool calculate_metrics --param tracks=app/lc_tests/fixtures/tracks.csv --bad-param tracks=C:/nonexistent/none.csv

      - name: Uninstall (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ENTRY="$HOME/.labconstrictor/apps/CellTracksColab.json"
          test -f "$ENTRY" && echo "registry entry present before uninstall" || echo "NOTE: registry entry missing before uninstall"
          bash "$HOME/ctc/uninstall.sh" 2> uninstall.err; echo "uninstall exit code $?"; cat uninstall.err
          test ! -d "$HOME/ctc" && echo "prefix removed" || { echo "FAIL: prefix still there"; exit 1; }
          test ! -f "$ENTRY" && echo "registry entry removed" || { echo "FAIL: registry entry still there"; exit 1; }
          ! grep -q WARNING uninstall.err || { echo "FAIL: uninstall printed a warning"; exit 1; }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs-${{ matrix.os_name }}
          path: |
            ~/ctc/menuinst_debug.log
            ~/.labconstrictor/logs
          if-no-files-found: ignore
