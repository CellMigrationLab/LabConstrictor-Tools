[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "labconstrictor-tools"
version = "0.1.0"
description = "Declare scientific tools as typed Python functions; Napari, Fiji and notebooks build their GUIs from the generated schema"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []   # standard library only: it has to live in every LabConstrictor app environment

[project.optional-dependencies]
test = ["numpy", "pandas", "tifffile", "scipy", "scikit-image", "ipywidgets", "ipython", "psutil", "hypothesis"]   # what the test suites and the example app need

[project.urls]
Repository = "https://github.com/CellMigrationLab/LabConstrictor-Tools"

[project.scripts]
labconstrictor-tools = "labconstrictor_tools.__main__:main"

[tool.setuptools]
packages = ["labconstrictor_tools", "labconstrictor_tools.examples"]


[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF100"]   # S: security (shell, exec, permissions); BLE: no blind except; RUF100: every noqa must still do something
ignore = ["E501", "UP031", "UP032", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "B007", "S", "BLE", "RUF100"]   # test scripts set up sys.path / env before importing; they assert, run subprocesses and expect failures on purpose
"tests/vulture_whitelist.py" = ["B018", "F821"]   # bare names on purpose: that is how vulture is told a name is used

[tool.coverage.run]
# production code only: the package, not the tests and not the example apps (they are test fixtures that tools run through)
source_pkgs = ["labconstrictor_tools"]
omit = ["*/labconstrictor_tools/examples/*", "*/tests/*"]
branch = true
parallel = true      # the workers and the command line run in subprocesses: one data file each, combined afterwards
patch = ["subprocess"]   # coverage also follows every Python process the tests start (workers, `labconstrictor-tools run`, snippets)
data_file = ".coverage"

[tool.coverage.report]
fail_under = 0   # set by the CI step to today's measured level, rounded down (see docs/TESTING.md)
show_missing = true
ignore_errors = true   # data of temporary copies of the package (test_sabotage.py) has no source left to read
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mutmut]
# nightly mutation testing (see docs/TESTING.md): the converters, the introspection, the geometry and the copied text, judged by the round-trip tests
source_paths = ["labconstrictor_tools"]
only_mutate = [
    "labconstrictor_tools/convert.py",
    "labconstrictor_tools/introspection.py",
    "labconstrictor_tools/shapes.py",
    "labconstrictor_tools/region.py",
    "labconstrictor_tools/command.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_roundtrip_matrix.py",
    "tests/test_roundtrip_properties.py",
    "tests/test_roundtrip_geometry.py",
    "tests/test_roundtrip_hints.py",
    "tests/test_roundtrip_command.py",
]

[tool.mypy]
# the example app uses the semantic marker types (Image, ...) as annotations on purpose
ignore_missing_imports = true
disallow_untyped_defs = true   # every function in the package is annotated; keep it that way
disallow_incomplete_defs = true
warn_unused_ignores = true   # a "type: ignore" that no longer silences anything is removed
exclude = ["labconstrictor_tools/examples/"]
